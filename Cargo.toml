[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/protocol",
    "crates/pty",
    "crates/store",
    "crates/daemon",
    "crates/engines",
    "crates/ui-gpui",
    "bins/autoharness",
    "bins/autoharnessd",
    "bins/updater",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
autoharness-core = { path = "crates/core" }
autoharness-protocol = { path = "crates/protocol" }
autoharness-pty = { path = "crates/pty" }
autoharness-store = { path = "crates/store" }
autoharness-daemon = { path = "crates/daemon" }
autoharness-engines = { path = "crates/engines" }
autoharness-ui-gpui = { path = "crates/ui-gpui" }
autoharness-updater = { path = "bins/updater" }

# GPUI is not published to crates.io; Zed's tree is the only source. Pinned to
# the exact revision diri uses, which is known to build a real app.
alacritty_terminal = { version = "0.26", default-features = false }
regex = "1"
tempfile = "3"
nucleo-matcher = "0.3"
unicode-segmentation = "1"

gpui = { git = "https://github.com/zed-industries/zed.git", rev = "dc2a339d5d043da448a3f7ddc7c0a85c63864aad" }
# `gpui` alone has no platform backend; `gpui_platform::application()` supplies
# the macOS one. font-kit gives it system font loading.
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "dc2a339d5d043da448a3f7ddc7c0a85c63864aad", features = ["font-kit"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "io-util", "time", "process"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Update verification only. A hand-rolled digest is the one shortcut that is
# never worth taking on a security boundary.
sha2 = "0.10"
winit = "0.30"
security-framework = "3"
libc = "0.2"
# Already present through GPUI's macOS backend. Direct, feature-minimal entries
# let the shell own its small native menu-bar status item without another tray
# abstraction or hand-written Objective-C calls.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
