<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img" aria-labelledby="autoharness-banner-title">
  <title id="autoharness-banner-title">AutoHarness — a macOS control center for coding agents</title>
  <!-- The shell is dark-only by design (crates/ui-gpui/src/theme.rs), so the
       card carries its own true black rather than inheriting the page. That
       makes one asset correct in both GitHub themes; no light variant needed. -->
  <rect x="0.5" y="0.5" width="679" height="219" rx="16" fill="#000000" stroke="#ffffff" stroke-opacity="0.14"/>

  <g transform="translate(56 66) scale(3.6667)">
    <rect x="1" y="1" width="22" height="22" rx="6" fill="#000000"/>
    <rect x="1.5" y="1.5" width="21" height="21" rx="5.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round">
      <path d="M12 6.5 7.5 12M12 6.5 16.5 12M7.5 12 12 17.5M16.5 12 12 17.5"/>
    </g>
    <g fill="#000000" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5">
      <circle cx="7.5" cy="12" r="2"/>
      <circle cx="16.5" cy="12" r="2"/>
      <circle cx="12" cy="17.5" r="2"/>
    </g>
    <circle cx="12" cy="6.5" r="2.25" fill="#2eccbd"/>
  </g>

  <!-- No font is embedded: a wordmark converted to outlines cannot be edited
       or re-spelled, and this stack resolves to the platform UI face on every
       machine that will read the README. Version and licence live in the
       badges, so nothing here has to be kept in sync with a release. -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="176" y="91" fill="#ffffff" font-size="56" font-weight="600" letter-spacing="-1.5">AutoHarness</text>
    <text x="176" y="123" fill="#ffffff" fill-opacity="0.60" font-size="19">A macOS control center for coding agents.</text>

    <!-- Product boundaries, not marketing: each is enforced in code. -->
    <g font-size="15.5" fill="#ffffff" fill-opacity="0.70" text-anchor="middle">
      <rect x="176" y="141" width="106" height="28" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="229" y="160">local only</text>
      <rect x="294" y="141" width="170" height="28" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="379" y="160">no external writes</text>
      <rect x="476" y="141" width="114" height="28" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="533" y="160">fail closed</text>
    </g>
  </g>
</svg>
