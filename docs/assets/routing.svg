<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 808" width="880" height="808" role="img" aria-labelledby="route-title route-desc">
  <title id="route-title">How one objective is routed</title>
  <desc id="route-desc">An objective becomes measured TaskFacts. If the engine offers no proposal or a low-confidence one, the run falls to Direct or BoundedLoop. A high-confidence proposal becomes a Swarm or DynamicDag, which additionally requires human approval before it can execute; a rejected proposal cancels the run. Execution is followed by acceptance checks in the run's own worktree and a commit on the run's branch.</desc>

  <defs>
    <marker id="route-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#ffffff" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="807" rx="16" fill="#000000" stroke="#ffffff" stroke-opacity="0.14"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">

    <g fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.14">
      <rect x="330" y="26" width="180" height="56" rx="10"/>
      <rect x="290" y="118" width="260" height="56" rx="10"/>
      <rect x="80" y="330" width="240" height="56" rx="10"/>
      <rect x="530" y="330" width="240" height="56" rx="10"/>
      <rect x="270" y="538" width="180" height="56" rx="10"/>
      <rect x="230" y="632" width="260" height="56" rx="10"/>
      <rect x="240" y="724" width="240" height="56" rx="10"/>
    </g>

    <!-- Cancellation is drawn in the danger tint because it is an outcome, not
         a failure of the router: a rejected plan is the guard working. -->
    <rect x="620" y="538" width="180" height="56" rx="10" fill="#0a0a0a" stroke="#f5453a" stroke-opacity="0.35"/>

    <!-- The two guards. Everything the router refuses to assume on its own
         narrows here, so they are the only shapes with an accent outline. -->
    <g fill="#0a0a0a" stroke="#f5a623" stroke-opacity="0.45" stroke-linejoin="round">
      <path d="M294 250 420 208 546 250 420 292Z"/>
      <path d="M534 462 650 420 766 462 650 504Z"/>
    </g>

    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" fill="none" stroke-linejoin="round" marker-end="url(#route-arrow)">
      <path d="M420 82 420 118"/>
      <path d="M420 174 420 208"/>
      <path d="M294 250 200 250 200 330"/>
      <path d="M546 250 650 250 650 330"/>
      <path d="M650 386 650 420"/>
      <path d="M534 462 360 462 360 538"/>
      <path d="M650 504 650 520 710 520 710 538"/>
      <path d="M200 386 200 566 270 566"/>
      <path d="M360 594 360 632"/>
      <path d="M360 688 360 724"/>
    </g>

    <g font-size="11.5" fill="#ffffff" fill-opacity="0.5" text-anchor="start">
      <text x="212" y="286">none, or</text>
      <text x="212" y="302">low confidence</text>
      <text x="662" y="286">high</text>
      <text x="662" y="302">confidence</text>
      <text x="372" y="500">approved</text>
      <text x="722" y="516" fill="#f5453a" fill-opacity="0.75">rejected</text>
    </g>

    <g fill="#ffffff" fill-opacity="0.92" font-size="14.5" font-weight="500">
      <text x="420" y="60">objective</text>
      <text x="420" y="143">TaskFacts</text>
      <text x="200" y="355">Direct / BoundedLoop</text>
      <text x="650" y="355">Swarm / DynamicDag</text>
      <text x="360" y="571">execute</text>
      <text x="360" y="657">acceptance checks</text>
      <text x="360" y="757">commit on the run's branch</text>
      <text x="710" y="571" fill="#f5453a" fill-opacity="0.85">cancelled</text>
    </g>

    <g fill="#ffffff" fill-opacity="0.5" font-size="11.5">
      <text x="420" y="160">measured, not inferred</text>
      <text x="360" y="674">in the run's own worktree</text>
    </g>

    <g fill="#f5a623" fill-opacity="0.9" font-size="13.5" font-weight="500">
      <text x="420" y="255">engine proposal?</text>
      <text x="650" y="467">human approval</text>
    </g>
  </g>
</svg>
